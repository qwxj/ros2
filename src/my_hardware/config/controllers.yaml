controller_manager:
  ros__parameters:
    update_rate: 100          # Hz，read()/write() 的调用频率

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_stamped_vel: false
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names : ["right_wheel_joint"]

    wheel_separation : 0.30   # 轮距
    wheel_radius : 0.05       # 轮半径

    # 里程计
    odom_frame_id : odom
    base_frame_id : base_link
    enable_odom_tf : true     # 实际中给到eft_local，要改为false

    publish_rate : 50.0
    open_loop: false
    position_feedback : true  # 真实位置反算里程计

    # 速度限制
    linear.x.max_velocity : 0.5
    linear.x.min_velocity : -0.5
    linear.x.max_acceleration : 1.0
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 3.0


joint_state_broadcaster:
  ros__parameters:
    publish_rate: 20.0