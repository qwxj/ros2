# 第 1 级 EKF：在 odom 系内融合轮式里程计 + IMU，接管 odom -> base_footprint
ekf_local:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom              # ★ 只在 odom 系内融合
    publish_tf: true               # ★ 接管 odom -> base_footprint（diff_drive 已关）

    publish_acceleration: false

    # ---- 轮式里程计 ----
    odom0: /odom
    odom0_config: [true,  true,  false,     # x, y, z
                   false, false, false,     # roll, pitch, yaw
                   true,  false, false,     # vx, vy, vz     ← vy 改成 false
                   false, false, true,      # vroll, vpitch, vyaw
                   false, false, false]     # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ---- IMU ----
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,      # 不取 orientation（Gazebo IMU 协方差为 0）
                  false, false, false,
                  false, false, true,       # ★ 只取 vyaw（角速度 z）
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true