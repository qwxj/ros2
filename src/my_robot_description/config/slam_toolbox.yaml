slam_toolbox:
  ros__parameters:
    # ---- 时间（必须，否则回放时会等不到时钟）----
    use_sim_time: true

    # ---- 坐标系（对应你 URDF 和插件的命名）----
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # ---- 工作模式 ----
    mode: mapping

    # ---- 地图 ----
    resolution: 0.05              # 5 cm / 像素
    map_update_interval: 1.0      # 每 1 秒刷新一次地图
    transform_publish_period: 0.02  # 50 Hz 发布 map->odom

    # ---- 何时插入新节点（关键调参项）----
    # 默认 0.5m / 0.5rad，仿真小车走得慢，调小一点地图更细
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    # ---- 激光参数 ----
    min_laser_range: 0.12 
    max_laser_range: 8.0          # 和 URDF 里一致
    minimum_time_interval: 0.2    # 两帧扫描最短间隔
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    # ---- 扫描匹配器 ----
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    loop_search_maximum_distance: 3.0