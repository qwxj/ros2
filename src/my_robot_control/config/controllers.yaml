controller_manager:
  ros__parameters:
    # 控制循环频率：100 Hz（read/write 各调一次）
    update_rate: 100

    # 关节状态发布器（position / velocity / effort 都会发）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 差速驱动控制器（velocity 指令）
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # IMU 广播器（把 SensorInterface 的 10 个状态接口打包成 sensor_msgs/Imu）
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    # 手动速度控制器：与 diff_drive_controller 争抢同一个 velocity 指令接口，
    # 所以两者只能有一个处于 active —— 正好用来演示 switch_controllers 热切换
    manual_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    # 力矩控制器：只在 motor_mode:=effort 时有意义
    manual_effort_controller:
      type: forward_command_controller/ForwardCommandController


diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.30
    wheel_radius: 0.05
    odom_frame_id: odom
    base_frame_id: base_link
    position_feedback: true
    open_loop: false
    # 启用 EKF 时必须是 false，否则 ekf_local 会和 diff_drive_controller
    # 抢着发同一个 odom -> base_link 变换（TF 会警告、且随机覆盖）
    enable_odom_tf: false
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    wheels_per_side: 1
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]


imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    # ★ 必须给协方差：broadcaster 默认全 0，而 robot_localization
    #   看到 0 协方差会理解成"这个测量完美无缺"，于是无条件信任 IMU，
    #   把陀螺常值偏置和噪声全部积分成 yaw 漂移。
    #   这里填的方差要和 ImuSensor 实际注入的参数匹配：
    #     angular_velocity  噪声 σ=0.01  -> 方差 1e-4
    #     orientation       等价 σ=0.02  -> 方差 4e-4
    #     linear_accel      噪声 σ=0.10  -> 方差 1e-2
    static_covariance_orientation: [4e-4, 0.0, 0.0, 0.0, 4e-4, 0.0, 0.0, 0.0, 4e-4]
    static_covariance_angular_velocity: [1e-4, 0.0, 0.0, 0.0, 1e-4, 0.0, 0.0, 0.0, 1e-4]
    static_covariance_linear_acceleration: [1e-2, 0.0, 0.0, 0.0, 1e-2, 0.0, 0.0, 0.0, 1e-2]


manual_velocity_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint
    interface_name: velocity


manual_effort_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint
    interface_name: effort
