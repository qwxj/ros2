# SLAM 通用默认参数
# 加载顺序：本文件 → config/robots/<robot>.yaml（后者覆盖前者同名项）
slam_mini:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    publish_tf: true

    # 地图
    resolution: 0.05
    map_size_m: 10.0
    publish_period: 2.0
    map_path: /home/wxj/mini_map

    # 激光安装外参（laser_link 相对 base_link）
    #   实测：车停在原点朝 -x 打，scan 读到 1.90 m，而障碍面在 x=-1.8，
    #   差值 0.10 m 就是激光的前向偏移。换底盘/换雷达位置要重新量。
    laser_x: 0.10
    laser_y: 0.0
    laser_yaw: 0.0

    # 扫描匹配（由粗到细相关性搜索）
    search_xy: 0.15
    search_yaw: 0.15
    search_steps: 7
    min_score: 0.35

    # 位姿图（后端：关键帧 + 回环 + 优化）
    #   前端（扫描匹配）负责"每帧准"，后端负责"全局一致"。
    use_pose_graph: true
    keyframe_dist: 0.30        # 每移动多少米记一个关键帧
    keyframe_angle: 0.15       # 或每转过多少弧度（原地转时靠它）
    loop_radius: 2.0           # 回环搜索半径（米）
    loop_min_gap: 10           # 至少隔多少帧才算回环候选
    loop_confirm_score: 0.75   # 回环确认的匹配得分阈值（最关键）
                             # 实测真回环 0.81~0.99，误判 ~0.64；门槛低于 0.7 会
                             # 放过误判，优化器会把整张图扯歪
    optimize_iterations: 50    # 每次优化的松弛轮数
