# 大型差速车：360 线激光、惯性大、场地大、算力充足
amcl_mini:
  ros__parameters:
    max_beams: 180
    sigma_hit: 0.20
    max_dist: 1.20
    min_particles: 500
    max_particles: 4000
    # 大车重、刹车距离长、打滑多
    alpha1: 0.20
    alpha2: 0.05
    alpha3: 0.20
    alpha4: 0.05

slam_mini:
  ros__parameters:
    map_size_m: 20.0
    resolution: 0.10
    search_xy: 0.30
    search_yaw: 0.25

    # 位姿图：场地大 → 关键帧稀一点、回环半径放大
    #   激光噪声大（sigma_hit 0.20）→ 回环得分普遍偏低，阈值要放宽
    keyframe_dist: 0.50
    keyframe_angle: 0.20
    loop_radius: 4.0
    loop_min_gap: 15
    loop_confirm_score: 0.55
