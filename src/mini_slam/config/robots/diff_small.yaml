# 小型差速车：128 线激光、噪声小、场地小、算力紧
amcl_mini:
  ros__parameters:
    max_beams: 64
    sigma_hit: 0.05
    max_dist: 0.60
    min_particles: 200
    max_particles: 1200
    # 小车轻、打滑少
    alpha1: 0.03
    alpha2: 0.01
    alpha3: 0.03
    alpha4: 0.01

slam_mini:
  ros__parameters:
    map_size_m: 8.0
    resolution: 0.05
    search_xy: 0.10
    search_yaw: 0.10

    # 位姿图：场地小 → 关键帧密一点、回环半径小一点
    #   激光噪声小（sigma_hit 0.05）→ 回环可以判得严一些
    keyframe_dist: 0.25
    keyframe_angle: 0.12
    loop_radius: 1.5
    loop_min_gap: 8
    loop_confirm_score: 0.65
